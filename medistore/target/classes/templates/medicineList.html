<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicine List - MediStore</title>
</head>
<body>
    <h1>Medicine List</h1>
    <p th:if="${viewType}">Viewing: <span th:text="${viewType}"></span></p>
    <p>Expired: <span th:text="${expiredCount}"></span> | Low Stock: <span th:text="${lowStockCount}"></span></p>
    <a th:href="@{/medicines/add}">Add Medicine</a> |
    <a th:href="@{/medicines/search}">Search</a> |
    <a th:href="@{/medicines/expired}">Expired</a> |
    <a th:href="@{/medicines/low-stock}">Low Stock</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Manufacturer</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Expiry</th>
                <th>Category</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="medicine : ${medicines}">
                <td th:text="${medicine.medicineId}"></td>
                <td th:text="${medicine.name}"></td>
                <td th:text="${medicine.manufacturer}"></td>
                <td th:text="${medicine.price}"></td>
                <td th:text="${medicine.stockQuantity}"></td>
                <td th:text="${medicine.expiryDate}"></td>
                <td th:text="${medicine.category}"></td>
                <td th:text="${medicine.medicineType}"></td>
                <td>
                    <a th:href="@{/medicines/update/{id}(id=${medicine.medicineId})}">Update</a>
                    <a th:href="@{/medicines/delete/{id}(id=${medicine.medicineId})}" onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/dashboard}">Back to Dashboard</a>
</body>
</html>
