<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStore - Add User</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9; --primary-dark: #0284c7; --primary-light: #e0f2fe;
            --secondary: #10b981; --danger: #ef4444;
            --bg: #f1f5f9; --surface: #ffffff; --text-primary: #0f172a;
            --text-secondary: #64748b; --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-glow: 0 0 20px rgba(14,165,233,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }
        .navbar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 32px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: var(--shadow-sm);
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; }
        .nav-logo-text { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .nav-badge { background: linear-gradient(135deg,#7c3aed,#6d28d9); color: white; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-left: 4px; }
        .nav-btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }

        .main { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .breadcrumb a { color: var(--primary); text-decoration: none; }
        .breadcrumb i { font-size: 10px; }

        .card { background: var(--surface); border-radius: 18px; padding: 36px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .card-header { margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
        .card-header h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
        .card-header h2 i { color: var(--primary); }
        .card-header p { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }

        /* Role selector tabs */
        .role-selector { display: flex; gap: 8px; margin-bottom: 26px; background: var(--bg); padding: 4px; border-radius: 12px; }
        .role-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 500; border-radius: 9px; cursor: pointer; transition: all 0.3s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .role-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-group { }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 7px; }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%; padding: 11px 16px 11px 42px; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; font-family: inherit;
            color: var(--text-primary); background: var(--bg); transition: all 0.3s ease;
        }
        .form-input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); }
        .form-input::placeholder { color: #94a3b8; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; }
        .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; }

        /* Admin-only fields */
        .admin-fields { display: none; }
        .admin-fields.show { display: contents; }

        .strength-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: all 0.3s; border-radius: 2px; }

        .form-actions { display: flex; gap: 12px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
        .btn { padding: 11px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s ease; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-glow); }
        .btn-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }

        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/admin/users" class="nav-logo">
            <div class="nav-logo-icon"><i class="fas fa-capsules"></i></div>
            <span class="nav-logo-text">MediStore</span>
            <span class="nav-badge">ADMIN</span>
        </a>
        <a th:href="@{/admin/users}" class="nav-btn">
            <i class="fas fa-arrow-left"></i> Back to Users
        </a>
    </nav>

    <main class="main">
        <div class="breadcrumb">
            <a th:href="@{/admin/users}">Users</a>
            <i class="fas fa-chevron-right"></i>
            <span>Add New User</span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-user-plus"></i> Add New User</h2>
                <p>Create a new Customer or Admin account in the system</p>
            </div>

            <div th:if="${error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <!-- Role Selector -->
            <div class="role-selector">
                <button type="button" class="role-btn active" onclick="setRole('CUSTOMER', this)">
                    <i class="fas fa-user"></i> Customer
                </button>
                <button type="button" class="role-btn" onclick="setRole('ADMIN', this)">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>

            <form th:action="@{/admin/users/create}" method="post">
                <input type="hidden" name="role" id="roleInput" value="CUSTOMER">

                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <div class="input-wrapper">
                            <input type="text" name="username" class="form-input" placeholder="e.g. johndoe" required minlength="3">
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" name="email" class="form-input" placeholder="john@example.com" required>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" name="phone" class="form-input" placeholder="07X XXXX XXX" required>
                            <i class="fas fa-phone input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <div class="input-wrapper">
                            <input type="text" name="address" class="form-input" placeholder="No. 12, Main St, Colombo" required>
                            <i class="fas fa-map-marker-alt input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" id="password" class="form-input"
                                   placeholder="Min. 6 characters" required minlength="6"
                                   oninput="checkStrength(this.value)">
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePwd()">
                                <i class="fas fa-eye-slash" id="pwdIcon"></i>
                            </button>
                        </div>
                        <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
                    </div>

                    <!-- Admin-only: Department field -->
                    <div class="form-group admin-fields" id="deptField">
                        <label class="form-label">Department</label>
                        <div class="input-wrapper">
                            <input type="text" name="department" class="form-input" placeholder="e.g. IT Administration">
                            <i class="fas fa-building input-icon"></i>
                        </div>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Create User
                    </button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function setRole(role, btn) {
            document.getElementById('roleInput').value = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const deptField = document.getElementById('deptField');
            if (role === 'ADMIN') deptField.classList.add('show');
            else deptField.classList.remove('show');
        }
        function togglePwd() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('pwdIcon');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
            icon.className = pwd.type === 'password' ? 'fas fa-eye-slash' : 'fas fa-eye';
        }
        function checkStrength(val) {
            const bar = document.getElementById('strengthBar');
            let s = 0;
            if (val.length >= 6) s++;
            if (val.match(/[a-z]/) && val.match(/[A-Z]/)) s++;
            if (val.match(/[0-9]/) && val.match(/[^a-zA-Z0-9]/)) s++;
            const colors = ['#ef4444','#f59e0b','#10b981'];
            const widths = ['33%','66%','100%'];
            bar.style.width = val.length > 0 ? (widths[s-1] || '10%') : '0';
            bar.style.background = val.length > 0 ? (colors[s-1] || '#ef4444') : '';
        }
    </script>
</body>
</html>
