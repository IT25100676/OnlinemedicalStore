<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - MediStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9; --primary-dark: #0284c7; --primary-light: #e0f2fe;
            --border: #e2e8f0; --bg: #f8fafc; --surface: #ffffff;
            --text-primary: #0f172a; --text-secondary: #475569; --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; height: 68px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }
        .nav-logo-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-size: 16px; }
        .nav-logo-text { font-size: 18px; font-weight: 700; }
        .nav-btn { padding: 10px 18px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .main { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .breadcrumb a { color: var(--primary); text-decoration: none; }
        .card { background: var(--surface); border-radius: 22px; padding: 32px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .card-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
        .card-title { font-size: 24px; font-weight: 700; }
        .card-subtitle { color: var(--text-secondary); margin-top: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-size: 14px; color: var(--text-primary); }
        .form-select { appearance: none; }
        .form-textarea { min-height: 120px; resize: vertical; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 24px; }
        .btn { padding: 12px 22px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); }
        .alert { border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; font-size: 14px; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .type-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-top: 10px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/admin/medicine" class="nav-logo">
        <div class="nav-logo-icon"><i class="fas fa-capsules"></i></div>
        <span class="nav-logo-text">MediStore</span>
    </a>
    <a th:href="@{/admin/medicine}" class="nav-btn"><i class="fas fa-arrow-left"></i>Back to Inventory</a>
</nav>

<main class="main">
    <div class="breadcrumb">
        <a th:href="@{/admin/medicine}">Medicine Inventory</a>
        <i class="fas fa-chevron-right"></i>
        <span>Add Medicine</span>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <div class="card-title">Add Medicine</div>
                <div class="card-subtitle">Create a new medicine record with stock and expiry details.</div>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/admin/medicine/add}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Medicine ID</label>
                    <input type="text" name="medicineId" class="form-input" placeholder="MED-1001" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-input" placeholder="Paracetamol" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Manufacturer</label>
                    <input type="text" name="manufacturer" class="form-input" placeholder="HealthCare Ltd." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" name="price" class="form-input" placeholder="100.00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" name="stockQuantity" class="form-input" placeholder="50" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Expiry Date</label>
                    <input type="date" name="expiryDate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="">Select category</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Medicine Type</label>
                    <select name="medicineType" id="medicineType" class="form-select" required>
                        <option value="TABLET">Tablet</option>
                        <option value="SYRUP">Syrup</option>
                        <option value="INJECTION">Injection</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-textarea" placeholder="Enter medicine details" required></textarea>
                </div>
            </div>

            <div id="tabletFields" class="type-panel" style="display:none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Mg per Tablet</label>
                        <input type="number" name="mgPerTablet" class="form-input" placeholder="500">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tablets per Strip</label>
                        <input type="number" name="tabletsPerStrip" class="form-input" placeholder="10">
                    </div>
                </div>
            </div>

            <div id="syrupFields" class="type-panel" style="display:none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Volume (ml)</label>
                        <input type="number" name="volumeMl" class="form-input" placeholder="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Flavor</label>
                        <input type="text" name="flavor" class="form-input" placeholder="Orange">
                    </div>
                </div>
            </div>

            <div id="injectionFields" class="type-panel" style="display:none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Dosage (mg)</label>
                        <input type="number" name="dosageMg" class="form-input" placeholder="5">
                    </div>
                    <div class="form-group" style="align-items: flex-end;">
                        <label class="form-label">Requires Prescription</label>
                        <input type="checkbox" name="requiresPrescription" style="width: auto; margin-top: 6px;">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i>Add Medicine</button>
                <a th:href="@{/admin/medicine}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i>Cancel</a>
            </div>
        </form>
    </div>
</main>

<script>
    const medicineType = document.getElementById('medicineType');
    const tabletFields = document.getElementById('tabletFields');
    const syrupFields = document.getElementById('syrupFields');
    const injectionFields = document.getElementById('injectionFields');

    function updateTypeFields() {
        tabletFields.style.display = medicineType.value === 'TABLET' ? 'block' : 'none';
        syrupFields.style.display = medicineType.value === 'SYRUP' ? 'block' : 'none';
        injectionFields.style.display = medicineType.value === 'INJECTION' ? 'block' : 'none';
    }

    medicineType.addEventListener('change', updateTypeFields);
    updateTypeFields();
</script>
</body>
</html>
