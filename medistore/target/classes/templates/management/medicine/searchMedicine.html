<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Medicine - MediStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9; --primary-dark: #0284c7; --border: #e2e8f0;
            --bg: #f8fafc; --surface: #ffffff; --text-primary: #0f172a; --text-secondary: #475569;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; height: 68px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }
        .nav-logo-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-size: 16px; }
        .nav-logo-text { font-size: 18px; font-weight: 700; }
        .nav-btn { padding: 10px 18px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .main { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .breadcrumb a { color: var(--primary); text-decoration: none; }
        .card { background: var(--surface); border-radius: 22px; padding: 32px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .card-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
        .card-title { font-size: 24px; font-weight: 700; }
        .card-subtitle { color: var(--text-secondary); margin-top: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .form-input, .form-select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-size: 14px; color: var(--text-primary); }
        .btn { padding: 12px 22px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 860px; }
        th, td { text-align: left; padding: 16px 14px; border-bottom: 1px solid var(--border); }
        th { font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-secondary); }
        tr:hover { background: #f8fafc; }
        .empty-state { padding: 24px; text-align: center; color: var(--text-secondary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/admin/medicine" class="nav-logo">
            <div class="nav-logo-icon"><i class="fas fa-capsules"></i></div>
            <span class="nav-logo-text">MediStore</span>
        </a>
        <a th:href="@{/admin/medicine}" class="nav-btn"><i class="fas fa-arrow-left"></i>Back to Inventory</a>
    </nav>

    <main class="main">
        <div class="breadcrumb">
            <a th:href="@{/admin/medicine}">Medicine Inventory</a>
            <i class="fas fa-chevron-right"></i>
            <span>Medicine Search</span>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">Search Medicine</div>
                    <div class="card-subtitle">Find medicines by keyword or category.</div>
                </div>
                <a th:href="@{/admin/medicine/add}" class="btn btn-primary"><i class="fas fa-plus"></i>New Medicine</a>
            </div>

            <form th:action="@{/admin/medicine/search}" method="get">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Keyword</label>
                        <input type="text" name="keyword" class="form-input" th:value="${searchKeyword}" placeholder="Name, manufacturer, description">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="">All categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == searchCategory}"></option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i>Search</button>
                    <a th:href="@{/admin/medicine}" class="btn btn-secondary"><i class="fas fa-list"></i>View All</a>
                </div>
            </form>

            <div class="table-wrapper" style="margin-top: 26px;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Manufacturer</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Expiry</th>
                            <th>Category</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="medicine : ${medicines}">
                            <td th:text="${medicine.medicineId}"></td>
                            <td th:text="${medicine.name}"></td>
                            <td th:text="${medicine.manufacturer}"></td>
                            <td th:text="${medicine.price}"></td>
                            <td th:text="${medicine.stockQuantity}"></td>
                            <td th:text="${medicine.expiryDate}"></td>
                            <td th:text="${medicine.category}"></td>
                            <td th:text="${medicine.medicineType}"></td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${medicines.empty}" class="empty-state">No medicines matched your search. Try a different keyword or category.</div>
            </div>
        </div>
    </main>
</body>
</html>
