<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Medicine - MediStore</title>
</head>
<body>
    <h1>Search Medicine</h1>
    <form th:action="@{/medicines/search}" method="get">
        <label>Keyword: <input type="text" name="keyword" th:value="${searchKeyword}"></label>
        <label>Category: 
            <select name="category">
                <option value="">All</option>
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == searchCategory}"></option>
            </select>
        </label>
        <button type="submit">Search</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Manufacturer</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Expiry</th>
                <th>Category</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="medicine : ${medicines}">
                <td th:text="${medicine.medicineId}"></td>
                <td th:text="${medicine.name}"></td>
                <td th:text="${medicine.manufacturer}"></td>
                <td th:text="${medicine.price}"></td>
                <td th:text="${medicine.stockQuantity}"></td>
                <td th:text="${medicine.expiryDate}"></td>
                <td th:text="${medicine.category}"></td>
                <td th:text="${medicine.medicineType}"></td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/medicines}">Back to List</a>
</body>
</html>
