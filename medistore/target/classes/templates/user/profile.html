<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStore - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9; --primary-dark: #0284c7; --primary-light: #e0f2fe;
            --secondary: #10b981; --danger: #ef4444;
            --bg: #f1f5f9; --surface: #ffffff; --text-primary: #0f172a;
            --text-secondary: #64748b; --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 20px rgba(14,165,233,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }

        /* Navbar */
        .navbar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 32px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; }
        .nav-logo-text { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-user { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary); }
        .nav-avatar { width: 34px; height: 34px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 600; }
        .nav-btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .nav-btn-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }

        /* Main */
        .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

        /* Profile Header Card */
        .profile-header {
            background: linear-gradient(135deg, #0c4a6e 0%, #0ea5e9 100%);
            border-radius: 20px; padding: 36px 40px; color: white;
            display: flex; align-items: center; gap: 28px; margin-bottom: 24px;
            position: relative; overflow: hidden;
        }
        .profile-header::before {
            content: ''; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .profile-avatar-lg { position: relative; z-index: 1; width: 88px; height: 88px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; border: 3px solid rgba(255,255,255,0.3); flex-shrink: 0; }
        .profile-info { position: relative; z-index: 1; flex: 1; }
        .profile-info h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .profile-info p { font-size: 14px; opacity: 0.85; margin-bottom: 12px; }
        .profile-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.2); }
        .badge-active { background: rgba(16,185,129,0.3); }

        /* Cards */
        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--surface); border-radius: 16px; padding: 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .card.full { grid-column: 1 / -1; }
        .card-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .card-title i { color: var(--primary); }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .info-value { color: var(--text-primary); font-weight: 600; }
        .status-active { color: var(--secondary); font-weight: 600; }
        .status-inactive { color: var(--danger); font-weight: 600; }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 7px; }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%; padding: 11px 16px 11px 42px; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; font-family: inherit;
            color: var(--text-primary); background: var(--bg); transition: all 0.3s ease;
        }
        .form-input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; }
        .btn { padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s ease; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-glow); }
        .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

        .alert { padding: 11px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }

        @media (max-width: 700px) {
            .cards-grid { grid-template-columns: 1fr; }
            .profile-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/profile" class="nav-logo">
            <div class="nav-logo-icon"><i class="fas fa-capsules"></i></div>
            <span class="nav-logo-text">MediStore</span>
        </a>
        <div class="nav-right">
            <div class="nav-user">
                <div class="nav-avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">J</div>
                <span th:text="${user.username}">User</span>
            </div>
            <a th:href="@{/logout}" class="nav-btn nav-btn-secondary">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar-lg" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">J</div>
            <div class="profile-info">
                <h2 th:text="${user.displayName}">Customer: John</h2>
                <p th:text="${user.email}">john@example.com</p>
                <div class="profile-badges">
                    <span class="badge" th:text="${user.role}">CUSTOMER</span>
                    <span th:if="${user.active}" class="badge badge-active">
                        <i class="fas fa-circle" style="font-size:8px;"></i> Active
                    </span>
                    <span th:unless="${user.active}" class="badge" style="background:rgba(239,68,68,0.3);">
                        Inactive
                    </span>
                    <span class="badge" th:text="'ID: ' + ${user.id}">ID: ABC123</span>
                </div>
            </div>
        </div>

        <div class="cards-grid">

            <!-- Account Info -->
            <div class="card">
                <div class="card-title"><i class="fas fa-id-card"></i> Account Information</div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-user"></i> Username</span>
                    <span class="info-value" th:text="${user.username}">johndoe</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="info-value" th:text="${user.email}">john@example.com</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-phone"></i> Phone</span>
                    <span class="info-value" th:text="${user.phone}">0771234567</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-map-marker-alt"></i> Address</span>
                    <span class="info-value" th:text="${user.address}">Colombo</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-calendar"></i> Member Since</span>
                    <span class="info-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">01 Jan 2026</span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-circle"></i> Status</span>
                    <span th:if="${user.active}" class="status-active"><i class="fas fa-check-circle"></i> Active</span>
                    <span th:unless="${user.active}" class="status-inactive"><i class="fas fa-times-circle"></i> Inactive</span>
                </div>
            </div>

            <!-- Change Password -->
            <div class="card">
                <div class="card-title"><i class="fas fa-key"></i> Change Password</div>
                <form th:action="@{/profile/password}" method="post">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="newPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="confirmPassword" class="form-input" placeholder="Repeat new password" required>
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Password
                    </button>
                </form>
            </div>

            <!-- Edit Profile -->
            <div class="card full">
                <div class="card-title"><i class="fas fa-user-edit"></i> Edit Profile</div>
                <form th:action="@{/profile/update}" method="post">
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <div class="input-wrapper">
                                <input type="email" name="email" class="form-input" th:value="${user.email}" required>
                                <i class="fas fa-envelope input-icon"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <div class="input-wrapper">
                                <input type="tel" name="phone" class="form-input" th:value="${user.phone}" required>
                                <i class="fas fa-phone input-icon"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <div class="input-wrapper">
                                <input type="text" name="address" class="form-input" th:value="${user.address}" required>
                                <i class="fas fa-map-marker-alt input-icon"></i>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> Save Changes
                    </button>
                </form>
            </div>

        </div>
    </main>
</body>
</html>
